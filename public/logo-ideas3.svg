  <g transform="translate(12,140)">
    <rect width="110" height="110" rx="12" fill="#0a0a0c"/>
    <g stroke="#f2f2f2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 76 L28 16 L36 16 L50 76"/>
      <path d="M16 52 H38"/>
